name: Build Snekbooru (Unstable)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_version:
        description: "Base version for the dev tag (e.g. v6.0.3 -> v6.0.3-dev.1)"
        required: false
        default: "v6.0.3"

permissions:
  contents: write

concurrency:
  group: snekbooru-unstable-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compute next dev version
        id: version
        shell: bash
        run: |
          BASE="${{ inputs.base_version || 'v6.0.3' }}"
          MAX=0
          for tag in $(git tag -l "${BASE}-dev.*" | sed -E 's/.*-dev\.([0-9]+)$/\1/'); do
            if [ "$tag" -gt "$MAX" ]; then MAX="$tag"; fi
          done
          NEXT=$((MAX + 1))
          echo "version=${BASE}-dev.${NEXT}" >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        run: pyinstaller Snekbooru.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snekbooru-${{ steps.version.outputs.version }}
          path: dist/Snekbooru.exe
          if-no-files-found: error

      - name: Publish unstable tag + prerelease
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" > /dev/null; then
            git config user.name "Snekbooru CI"
            git config user.email "ci@snekbooru.local"
            git tag "${VERSION}"
            git push origin "${VERSION}"
          fi
          gh release create "${VERSION}" dist/Snekbooru.exe \
            --title "Snekbooru ${VERSION} (unstable)" \
            --prerelease \
            --notes "Unstable development build (commit ${{ github.sha }}). Install by downloading and running Snekbooru.exe."
        env:
          GH_TOKEN: ${{ github.token }}
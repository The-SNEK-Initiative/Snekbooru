name: Build Snekbooru (Unstable)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_version:
        description: "Optional base version for the dev tag (e.g. v6.0.3); defaults to the version parsed from USER_AGENT."
        required: false

permissions:
  contents: write

concurrency:
  group: snekbooru-unstable-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check dev USER_AGENT
        id: ua_check
        shell: bash
        run: |
          UA=$(grep -m1 '^USER_AGENT' snekbooru/common/constants.py)
          if echo "$UA" | grep -qE 'Snekbooru/[^ ]+ [^ ]+ Dev Release \(https://www\.snekbooru\.org\)'; then
            echo "USER_AGENT is a Dev Release; continuing with unstable build."
            echo "is_dev=yes" >> "$GITHUB_OUTPUT"
          else
            echo "USER_AGENT is not a Dev Release; skipping unstable build."
            echo "is_dev=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.ua_check.outputs.is_dev == 'yes'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compute next dev version
        if: steps.ua_check.outputs.is_dev == 'yes'
        id: version
        shell: bash
        run: |
          BASE="${{ inputs.base_version }}"
          if [ -z "$BASE" ]; then
            VER=$(grep -m1 '^USER_AGENT' snekbooru/common/constants.py | sed -E 's/.*Snekbooru\/([0-9]+(\.[0-9]+)*).*/\1/')
            if [ -z "$VER" ]; then
              echo "Could not parse version from USER_AGENT" >&2
              exit 1
            fi
            BASE="v${VER}"
          fi
          MAX=0
          for tag in $(git tag -l "${BASE}-dev.*" | sed -E 's/.*-dev\.([0-9]+)$/\1/'); do
            if [ "$tag" -gt "$MAX" ]; then MAX="$tag"; fi
          done
          NEXT=$((MAX + 1))
          echo "version=${BASE}-dev.${NEXT}" >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        if: steps.ua_check.outputs.is_dev == 'yes'
        run: pyinstaller Snekbooru.spec --noconfirm

      - name: Upload build artifact
        if: steps.ua_check.outputs.is_dev == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: Snekbooru-${{ steps.version.outputs.version }}
          path: dist/Snekbooru.exe
          if-no-files-found: error

      - name: Publish unstable tag + prerelease
        if: steps.ua_check.outputs.is_dev == 'yes'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" > /dev/null; then
            git config user.name "Snekbooru CI"
            git config user.email "ci@snekbooru.local"
            git tag "${VERSION}"
            git push origin "${VERSION}"
          fi
          gh release create "${VERSION}" dist/Snekbooru.exe \
            --title "Snekbooru ${VERSION} (unstable)" \
            --prerelease \
            --notes "Unstable development build (commit ${{ github.sha }}). Install by downloading and running Snekbooru.exe."
        env:
          GH_TOKEN: ${{ github.token }}